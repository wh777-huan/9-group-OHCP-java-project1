server:
  port: 8080

spring:
  application:
    name: ohcp-agri-agent

  ai:
    openai:
      # 密钥只走环境变量，不要写进代码/配置文件——提交到 GitHub 会泄露
      # DeepSeek:  OHCP_LLM_BASE_URL=https://api.deepseek.com     模型 deepseek-chat
      # 通义兼容: OHCP_LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode
      # 本地 Ollama: OHCP_LLM_BASE_URL=http://localhost:11434
      api-key: ${OHCP_LLM_API_KEY:sk-not-configured}
      base-url: ${OHCP_LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OHCP_LLM_MODEL:deepseek-chat}
          temperature: 0.3

logging:
  level:
    root: INFO
    com.ohcp.agri: DEBUG
