# DeepSeek OpenAI兼容端点（通过环境变量注入，勿硬编码密钥）
spring.ai.openai.base-url=${OHCP_LLM_BASE_URL:https://api.deepseek.com}
spring.ai.openai.api-key=${OHCP_LLM_API_KEY:}
spring.ai.openai.chat.options.model=${OHCP_LLM_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=0.3

# 服务器端口
server.port=8080

# JSON 知识库路径
app.knowledge.path=classpath:knowledge/nutrient_deficiency.json
